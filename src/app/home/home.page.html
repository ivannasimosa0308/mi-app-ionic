<ion-content [fullscreen]="true">

  <!-- Contenedor principal para organizar los elementos -->
  <div class="home-container">

    <!-- 4. Título en rojo, mayúsculas y centrado -->
    <h1 class="titulo-rojo">Mi aplicación ionic</h1>

    <!-- 3 & 5. Botón a la derecha en azul -->
    <div class="contenedor-boton">
      <ion-button color="primary" class="boton-derecha">
        Accionar
      </ion-button>
    </div>

    <!-- 6. Imagen centrada con borde en verde de grosor 3px -->
    <div class="contenedor-imagen">
      <img src="https://picsum.photos/300/200" alt="Imagen de ejemplo" class="imagen-verde" />
    </div>

  </div>

</ion-content>
